<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#07111b" />
    <meta name="description" content="TSI — prototype de combat 3D." />
    <title>TSI — Next Generation Shooter</title>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="application" aria-label="Terrain d'entraînement 3D TSI"></canvas>
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">TSI</span>
          <span class="brand-copy"><strong>NEXT GENERATION</strong><small>COMBAT SANDBOX / 001</small></span>
        </div>
        <div class="session-chip"><i></i><span>LOCAL TRAINING</span></div>
      </header>
      <section class="mission-card">
        <span class="eyebrow">SECTEUR 01 / KANTARA</span>
        <strong>DELTA OUTPOST</strong>
        <span class="mission-subtitle">ÉLIMINE LES CIBLES D'ENTRAÎNEMENT</span>
      </section>
      <div id="crosshair" aria-hidden="true"><span></span><i></i></div>
      <section class="status-panel">
        <div><span class="stat-label">ÉLIMINATIONS</span><strong id="kills">00</strong></div>
        <div><span class="stat-label">PRÉCISION</span><strong id="accuracy">—</strong></div>
        <div><span class="stat-label">ÉTAT</span><strong id="game-status">PRÊT</strong></div>
      </section>
      <section class="bottom-hud">
        <div class="health-card">
          <span class="stat-label">OPÉRATEUR</span>
          <strong>100 <small>HP</small></strong>
          <div class="health-track"><i></i></div>
        </div>
        <div class="ammo-card">
          <span class="ammo-count" id="ammo">30</span>
          <span class="ammo-total">/ 120</span>
          <span class="stat-label">CARABINE TSI-01</span>
        </div>
      </section>
      <div id="joystick" class="joystick" aria-label="Contrôle de déplacement tactile">
        <div id="joystick-knob"></div>
      </div>
      <div class="touch-actions">
        <button id="reload-button" class="action-button reload-button" type="button">RELOAD</button>
        <button id="fire-button" class="action-button fire-button" type="button">FIRE</button>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
      <footer class="footer-note">WASD / SOURIS · CLIC GAUCHE : TIR · R : RECHARGER · MOBILE : COMMANDES TACTILES</footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
