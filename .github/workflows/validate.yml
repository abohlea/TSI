name: TSI validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsi-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    name: PlayCanvas prototype typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Production bundle
        run: npm run build

  realtime:
    name: Colyseus server typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/realtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Compile server
        run: npm run build

  firebase-rules:
    name: Firestore security rules emulator tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/firebase
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Configure Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Run Firestore rules tests
        run: npm test
      - name: Install realtime server dependencies
        working-directory: backend/realtime
        run: npm install --no-audit --no-fund
      - name: Test server-owned Firestore player provisioning
        run: npm run test:server-integration
