name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/android-production-field-test
    paths:
      - "prototype/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TSI production-branch debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: prototype/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build web client
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web client into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: prototype/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tsi-production-field-test-android-debug
          path: prototype/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
