name: TSI client checks

on:
  push:
    paths:
      - "game-client/**"
      - ".github/workflows/tsi-client.yml"
  pull_request:
    paths:
      - "game-client/**"
      - ".github/workflows/tsi-client.yml"

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-client/package.json
      - name: Install dependencies
        working-directory: game-client
        run: npm install --no-audit --no-fund
      - name: Type check and build
        working-directory: game-client
        run: npm run build
