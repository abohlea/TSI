name: TSI project checks

on:
  push:
    paths:
      - "game-client/**"
      - "server/**"
      - "backend/firebase/**"
      - "firestore.rules"
      - "firebase.json"
      - "firestore.indexes.json"
      - ".github/workflows/tsi-client.yml"
  pull_request:
    paths:
      - "game-client/**"
      - "server/**"
      - "backend/firebase/**"
      - "firestore.rules"
      - "firebase.json"
      - "firestore.indexes.json"
      - ".github/workflows/tsi-client.yml"

permissions:
  contents: read

jobs:
  client:
    name: PlayCanvas client typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - name: Install client dependencies
        working-directory: game-client
        run: npm install --no-audit --no-fund
      - name: Type check and build client
        working-directory: game-client
        run: npm run build

  server:
    name: Colyseus server typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Type check server
        working-directory: server
        run: npm run check
      - name: Test and build server
        working-directory: server
        run: npm test

  firebase-rules:
    name: Firestore rules emulator tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firebase test dependencies
        working-directory: backend/firebase
        run: npm install --no-audit --no-fund
      - name: Type check Firebase rules tests
        working-directory: backend/firebase
        run: npm run typecheck
      - name: Run Firestore rules emulator tests
        working-directory: backend/firebase
        run: npm test

      - name: Install TSI server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Verify Firebase Auth tokens and Firestore provisioning
        working-directory: backend/firebase
        env:
          FIREBASE_PROJECT_ID: demo-tsi-local
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: npx firebase --config ../../firebase.json emulators:exec --project demo-tsi-local --only auth,firestore "cd ../../server && npm run test:firebase-integration"
